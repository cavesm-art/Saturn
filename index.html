<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission to Saturn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#080c24; --bg2:#0f1640; --card:#131b4b; --card2:#1c2762; --line:#33428f;
  --gold:#f2d08e; --amber:#e0a24f; --ice:#8fe3f0; --ink:#f3f4ff; --mute:#b6bde8;
  --good:#7be3a7; --bad:#ff9c8f; --focus:#ffe28a;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:800;line-height:1.15;margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 24px;background:rgba(8,12,36,.92);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-family:var(--serif);font-weight:800;font-size:1.35rem;color:var(--gold);white-space:nowrap}
#steps{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:260px}
.step{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-size:.9rem;cursor:pointer;color:var(--mute)}
.step[aria-current="step"]{background:var(--gold);color:#241a05;border-color:var(--gold);font-weight:700}
.step.done{color:var(--good);border-color:var(--good)}
.step:disabled{opacity:.4;cursor:not-allowed}
#who{color:var(--mute);font-size:.95rem}
main{max-width:1320px;margin:0 auto;padding:22px 24px 80px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.labcard{padding:14px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}
@media (max-width:980px){.labcard{position:static}}
canvas#cv{display:block;width:100%;height:clamp(320px,46vw,470px);border-radius:10px;background:#070a1e;touch-action:manipulation;cursor:pointer}
#modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tab{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:7px 14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ice);color:#06222a;border-color:var(--ice);font-weight:700}
#controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;min-height:40px}
.ctl{display:flex;gap:10px;align-items:center;color:var(--mute)}
input[type=range]{accent-color:var(--gold);width:min(260px,60vw)}
.rd{font-weight:700;color:var(--gold)}
.btn{border:0;background:var(--gold);color:#241a05;font-weight:700;border-radius:10px;padding:10px 20px;cursor:pointer}
.btn.sm{padding:6px 14px;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:4px 12px;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);color:#2a1604;border-color:var(--amber);font-weight:700}
.eyebrow{color:var(--mute);margin:0 0 6px;font-size:.95rem}
h2.stage-title{font-size:2.1rem;margin-bottom:8px}
.lead{margin:0 0 14px;color:var(--ink)}
.info{background:var(--card2);border-left:4px solid var(--ice);border-radius:8px;padding:12px 16px;margin:14px 0}
.info h3{font-size:1.15rem;margin-bottom:4px;color:var(--ice)}
.info p{margin:0}
.disc{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.disc li{display:flex;gap:10px;align-items:flex-start;color:var(--mute)}
.disc li::before{content:"";flex:none;width:18px;height:18px;margin-top:4px;border:2px solid var(--line);border-radius:50%}
.disc li.on{color:var(--ink)}
.disc li.on::before{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 3px var(--card)}
h3.sec{font-size:1.25rem;margin:22px 0 8px}
.q{border-top:1px solid var(--line);padding:16px 0}
.qtext{margin:0 0 10px;font-weight:700}
.qn{color:var(--gold);margin-right:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through;opacity:.8}
.opt.ok{border-color:var(--good);background:rgba(123,227,167,.14)}
.opt.sel{border-color:var(--gold);background:rgba(242,208,142,.14)}
.fb{margin:8px 0 0;min-height:1.4em;font-size:.98rem}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
table.match{width:100%;border-collapse:collapse}
table.match td{padding:6px 8px 6px 0;vertical-align:middle}
select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
select.ok{border-color:var(--good)} select.bad{border-color:var(--bad)}
textarea{width:100%;min-height:90px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
.nav .hint{color:var(--mute);font-size:.95rem}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--gold);color:#241a05;font-weight:700;padding:10px 20px;border-radius:999px;transition:.3s;pointer-events:none;z-index:50}
#toast.show{transform:translate(-50%,0);opacity:1}
.hero h1{font-size:clamp(2.4rem,5vw,3.6rem);margin-bottom:12px}
.hero .steps6{margin:12px 0 18px;padding-left:22px}
.name{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 14px}
.qtext select{width:auto;display:inline-block;margin:0 6px;padding:4px 8px;font-weight:400}
.qt{color:var(--mute);font-weight:400;font-size:.9rem}
.pp{margin-bottom:14px}
.pp.done{color:var(--good);padding:10px 20px}
.pp.locked{color:var(--mute);opacity:.7;padding:10px 20px}
.bank{background:var(--card2);border-radius:8px;padding:8px 14px;margin:10px 0}
.report h2{font-size:2rem}
.score{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.score div{background:var(--card2);border-radius:10px;padding:10px 18px}
.score b{display:block;font-family:var(--serif);font-size:1.8rem;color:var(--gold)}
.rq{margin:0 0 10px;padding-left:0;list-style:none}
.rq li{padding:6px 0;border-top:1px solid var(--line)}
.rq .a{color:var(--ice)}
.rq .t{color:var(--mute);font-size:.9rem}
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .top,.noprint,#toast{display:none!important}
  .card{background:#fff;border:0;padding:0}
  .rq .a{color:#000;font-weight:700} .rq .t,.rq li{color:#333;border-color:#ccc}
  .score div{background:#eee} .score b{color:#000}
  h2,h3{color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Mission to Saturn</div>
  <nav id="steps" aria-label="Mission steps"></nav>
  <div id="who"></div>
</header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function lerp(a,b,t){return a+(b-a)*t;}
var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var MO=calm?0.25:1;
function h(tag,attrs){
  var e=document.createElement(tag);
  for(var k in (attrs||{})){
    var v=attrs[k];
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++){
    var kid=arguments[i];
    if(Array.isArray(kid)){kid.forEach(function(x){if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x));});}
    else if(kid!=null&&kid!==false)e.append(kid.nodeType?kid:document.createTextNode(kid));
  }
  return e;
}
var main=document.getElementById('main');
var S={name:'',stage:0,ans:{},disc:{},vc:0};
var N=7;

/* ---------- shared drawing ---------- */
var stars=[];for(var i=0;i<150;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*TAU,s:.5+Math.random()*1.5});
function drawSpace(c,w,hh,t){
  var g=c.createLinearGradient(0,0,0,hh);g.addColorStop(0,'#0b1236');g.addColorStop(1,'#060919');
  c.fillStyle=g;c.fillRect(0,0,w,hh);
  c.fillStyle='#fff';
  stars.forEach(function(s){c.globalAlpha=calm?.6:.35+.45*Math.sin(t*s.s+s.p)*.5+.2;c.fillRect(s.x*w,s.y*hh,s.r,s.r);});
  c.globalAlpha=1;
}
var BANDS=[[.08,'#b99458'],[.10,'#dcc28c'],[.12,'#c9a468'],[.14,'#ecd7a5'],[.12,'#d3b074'],[.14,'#e8cf98'],[.12,'#c29c60'],[.10,'#dcc28c'],[.08,'#b48f55']];
function planet(c,cx,cy,R,o){
  o=o||{};var ob=o.ob==null?0.09:o.ob,ry=R*(1-ob),t=o.t||0;
  c.save();c.beginPath();c.ellipse(cx,cy,R,ry,0,0,TAU);c.clip();
  var y=cy-ry,i;
  for(i=0;i<BANDS.length;i++){var bh=ry*2*BANDS[i][0];c.fillStyle=BANDS[i][1];c.fillRect(cx-R,y,2*R,bh+1);
    var sp=o.speeds?o.speeds[i]:60;
    for(var k=0;k<4;k++){
      var u=((k*.37+i*.13+t*sp*.00018*MO)%1+1)%1;
      c.fillStyle=(k%2)?'rgba(255,248,225,.16)':'rgba(120,80,30,.14)';
      c.beginPath();c.ellipse(cx-R+u*2*R,y+bh/2,R*.3,bh*.28,0,0,TAU);c.fill();
    }
    if(o.sel===i){c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(cx-R,y+1,2*R,bh-1);}
    y+=bh;}
  var g=c.createRadialGradient(cx-R*.35,cy-R*.3,R*.1,cx,cy,R*1.05);
  g.addColorStop(0,'rgba(255,255,255,.14)');g.addColorStop(.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(8,6,28,.7)');
  c.fillStyle=g;c.fillRect(cx-R,cy-ry,2*R,2*ry);
  c.restore();
}
var RINGS=[
 {id:'D',name:'D Ring',a:1.11,b:1.24,col:'#d9c9a8',al:.18,pa:.3},
 {id:'C',name:'C Ring',a:1.24,b:1.53,col:'#a99a82',al:.35,pa:.45},
 {id:'B',name:'B Ring',a:1.53,b:1.95,col:'#f1e3c3',al:.9,pa:.9},
 {id:'CD',name:'Cassini Division',a:1.95,b:2.03,col:'#2a2a44',al:.1,pa:0},
 {id:'A',name:'A Ring',a:2.03,b:2.27,col:'#d9c7a0',al:.65,pa:.7},
 {id:'F',name:'F Ring',a:2.31,b:2.35,col:'#efe3c9',al:.8,pa:.9},
 {id:'G',name:'G Ring',a:2.75,b:2.88,col:'#c9bda6',al:.25,pa:.35},
 {id:'E',name:'E Ring',a:2.99,b:7.97,col:'#9fd9e8',al:.09,pa:.25}
];
function ringById(id){for(var i=0;i<RINGS.length;i++)if(RINGS[i].id===id)return RINGS[i];}
var HIDE_E=false;
var PARTS=[];
[['D',160],['C',500],['B',1500],['A',1000],['F',140],['G',140],['E',700]].forEach(function(p){
  var g=ringById(p[0]);
  for(var i=0;i<p[1];i++){
    var r=p[0]==='E'?clamp(3.6+(Math.random()+Math.random()-1)*3,2.99,7.97):g.a+Math.random()*(g.b-g.a);
    PARTS.push({id:p[0],r:r,th:Math.random()*TAU,s:Math.random()<.08?2:1,g:g});
  }
});
function ringBand(c,w,hh,cx,cy,R,s,front,sel){
  c.save();c.beginPath();
  if(front)c.rect(0,cy,w,hh-cy);else c.rect(0,0,w,cy);
  c.clip();
  RINGS.forEach(function(g){
    if(HIDE_E&&g.id==='E')return;
    c.beginPath();
    c.ellipse(cx,cy,g.b*R,g.b*R*s,0,0,TAU);
    c.ellipse(cx,cy,g.a*R,g.a*R*s,0,0,TAU);
    c.fillStyle=g.col;c.globalAlpha=g.al;c.fill('evenodd');
    if(sel===g.id){c.globalAlpha=.35;c.fillStyle='#ffe28a';c.fill('evenodd');c.globalAlpha=1;c.strokeStyle='#ffe28a';c.lineWidth=1.5;
      c.beginPath();c.ellipse(cx,cy,g.b*R,g.b*R*s,0,0,TAU);c.stroke();c.beginPath();c.ellipse(cx,cy,g.a*R,g.a*R*s,0,0,TAU);c.stroke();}
  });
  c.globalAlpha=1;c.restore();
}
function ringParts(c,cx,cy,R,s,t,front,sel){
  var sz=Math.max(1,R/60);
  for(var i=0;i<PARTS.length;i++){
    var p=PARTS[i];if(HIDE_E&&p.id==='E')continue;var th=p.th+t*.5*MO*Math.pow(p.r,-1.5)*2;
    var sn=Math.sin(th);if((sn>0)!==front)continue;
    c.globalAlpha=sel===p.id?1:p.g.pa;
    c.fillStyle=sel===p.id?'#fff4c8':p.g.col;
    c.fillRect(cx+Math.cos(th)*p.r*R,cy+sn*p.r*R*s,sz*p.s,sz*p.s);
  }
  c.globalAlpha=1;
}
function ringSystem(c,w,hh,cx,cy,R,tilt,t,o){
  o=o||{};HIDE_E=!!o.noE;var s=Math.sin(tilt);
  ringBand(c,w,hh,cx,cy,R,s,false,o.sel);ringParts(c,cx,cy,R,s,t,false,o.sel);
  planet(c,cx,cy,R,{ob:o.ob==null?.09:o.ob,t:t});
  ringBand(c,w,hh,cx,cy,R,s,true,o.sel);ringParts(c,cx,cy,R,s,t,true,o.sel);
  if(s<.06){c.strokeStyle='rgba(240,225,190,.8)';c.lineWidth=2;c.beginPath();c.moveTo(cx-2.3*R,cy);c.lineTo(cx+2.3*R,cy);c.stroke();}
}
function label(c,txt,x,y,col,size,align){
  c.font=(size||14)+'px '+getComputedStyle(document.body).fontFamily;c.fillStyle=col||'#f3f4ff';c.textAlign=align||'left';c.textBaseline='middle';c.fillText(txt,x,y);
}
function ball(c,x,y,r,kind){
  c.save();
  var g=c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
  if(kind==='earth'){g.addColorStop(0,'#7fd0ff');g.addColorStop(1,'#1d4f9a');}
  else{g.addColorStop(0,'#f6e2b0');g.addColorStop(1,'#a5782f');}
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  if(kind==='earth'){c.fillStyle='rgba(70,170,90,.8)';c.beginPath();c.ellipse(x-r*.25,y-r*.1,r*.35,r*.25,.5,0,TAU);c.fill();c.beginPath();c.ellipse(x+r*.35,y+r*.3,r*.2,r*.28,0,0,TAU);c.fill();}
  else{c.strokeStyle='rgba(245,230,190,.85)';c.lineWidth=2;c.beginPath();c.ellipse(x,y,r*1.5,r*.35,-.25,0,TAU);c.stroke();}
  c.restore();
}

/* ---------- Lab 0: start ---------- */
function Lab0(api){
  return {modes:[],setMode:function(){api.info('Welcome aboard','Saturn is a gas giant with rings made of ice. You will visit six stops.');},
  draw:function(c,w,hh,t){var R=Math.min(hh*.2,w*.13);ringSystem(c,w,hh,w*.5,hh*.5,R,0.42,t,{noE:true});}};
}

/* ---------- Lab 1: Meet Saturn ---------- */
function Lab1(api){
  var mode='spin',k=.12,tw=null,sl=null,rd=null,objs=[],on9=false,on21=false,p9=0,p21=0,dropped={earth:false,saturn:false};
  var modes=[['spin','Spin it'],['float','Float test'],['size','Size check']];
  function upd(){
    var hrs=24-16*k;rd.textContent='One day: '+hrs.toFixed(1)+' hours';
    if(k>.6)api.discover('spin');
  }
  function setMode(m){
    mode=m;var c=api.controls;c.innerHTML='';
    if(m==='spin'){
      rd=h('output',{class:'rd'});
      sl=h('input',{type:'range',min:0,max:100,value:Math.round(k*100),'aria-label':'Spin speed',oninput:function(e){k=e.target.value/100;tw=null;upd();}});
      c.append(h('label',{class:'ctl'},'Spin speed ',sl),rd,h('button',{class:'btn sm',onclick:function(){tw={from:k,to:.84,t:0};}},'Set to Saturn'));
      upd();api.info('Spin it','Slide the spin faster. Watch the shape. A fast spin makes a planet bulge in the middle. That shape is called an oblate spheroid. Saturn spins once every 10.6 hours.');
    }else if(m==='float'){
      c.append(h('button',{class:'btn sm',onclick:function(){objs.push({k:'earth',x:0,y:-1,vy:0,w:false});dropped.earth=true;chk();}},'Drop Earth'),
               h('button',{class:'btn sm',onclick:function(){objs.push({k:'saturn',x:0,y:-1,vy:0,w:false});dropped.saturn=true;chk();}},'Drop Saturn'),
               h('button',{class:'btn sm ghost',onclick:function(){objs=[];}},'Clear'));
      api.info('Float test',`Density tells how much stuff is packed in a space. Water is 1.0. Earth is 5.5, so it sinks. Saturn is only 0.69. Drop both and see.`);
    }else{
      c.append(h('button',{class:'btn sm',onclick:function(){on9=!on9;if(on9)chk2();}},'Line up Earths across Saturn'),
               h('button',{class:'btn sm',onclick:function(){on21=!on21;if(on21)chk2();}},'Line up Earths across the rings'));
      api.info('Size check','Saturn is the second largest planet. About 9 Earths fit across its middle. Its rings are even wider: more than 21 Earths side by side.');
    }
  }
  function chk(){if(dropped.earth&&dropped.saturn)api.discover('float');}
  function chk2(){if(on9&&on21)api.discover('size');}
  function draw(c,w,hh,t,dt){
    if(tw){tw.t+=dt/1.1;var e=clamp(tw.t,0,1);k=lerp(tw.from,tw.to,e*e*(3-2*e));if(sl)sl.value=Math.round(k*100);upd();if(tw.t>=1)tw=null;}
    var R,cx=w/2,cy=hh/2;
    if(mode==='spin'){
      R=Math.min(hh*.33,w*.22);var ob=.22*k;
      c.setLineDash([5,6]);c.strokeStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(cx,cy,R,0,TAU);c.stroke();c.setLineDash([]);
      planet(c,cx,cy,R,{ob:ob,t:t,speeds:BANDS.map(function(){return 40+k*500;})});
      label(c,'Dashed circle = a perfect ball',cx,hh-18,'#b6bde8',14,'center');
    }else if(mode==='float'){
      var x0=w*.16,x1=w*.84,wy=hh*.42,bot=hh*.92,r=Math.min(34,hh*.075);
      c.fillStyle='rgba(60,140,210,.45)';c.fillRect(x0,wy,x1-x0,bot-wy);
      c.strokeStyle='#8fe3f0';c.lineWidth=2;c.beginPath();
      for(var x=x0;x<=x1;x+=6){var yy=wy+Math.sin(x*.05+t*2*MO)*2.5;if(x===x0)c.moveTo(x,yy);else c.lineTo(x,yy);}c.stroke();
      c.strokeStyle='#cfe8ff';c.lineWidth=3;c.beginPath();c.moveTo(x0,hh*.2);c.lineTo(x0,bot);c.lineTo(x1,bot);c.lineTo(x1,hh*.2);c.stroke();
      label(c,'Water  1.0',x0+10,wy+18,'#e8f6ff',15);
      label(c,'Earth  5.5 g/cm³',x0+10,hh*.08,'#7fd0ff',15);label(c,'Saturn  0.69 g/cm³',x0+10,hh*.08+22,'#f2d08e',15);
      objs.forEach(function(o){
        if(o.y<0){o.y=hh*.1;o.x=o.k==='earth'?w*.35:w*.65;}

/* ---------- Lab 2: Inside Saturn ---------- */

  function draw(c,w,hh,t,dt){

      dots.forEach(function(d){

        for(var k=0;k<7;k++){var an=k/7*TAU,rr=r*(.8+.25*Math.sin(k*2.3+p.x*9));k?c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):c.moveTo(Math.cos(an)*rr,Math.sin(an)*rr);}

    }else{

          var yy=y0+(st-1)*7+bump*(.6+.2*st)+Math.sin(x*.05+st*2+t*.6*MO)*3;c.fillRect(x,yy,2.2,2.2);}}

  }
  function down(x,y,w,hh){
    if(mode==='map'){
      var base=(w/2*.9)/2.4,R=base*zoom,s=Math.sin(tiltDeg*Math.PI/180),dx=x-w/2,dy=(y-hh/2)/Math.max(s,.08),r=Math.hypot(dx,dy)/R;

    }
  }
  return {modes:modes,setMode:setMode,draw:draw,down:down};
}

      c.fillStyle='rgba(20,15,10,.55)';c.beginPath();c.ellipse(cx+r*.2,cy+r*.45,r*.28,r*.1,0,0,TAU);c.fill();c.beginPath();c.ellipse(cx-r*.35,cy+r*.2,r*.15,r*.06,0,0,TAU);c.fill();
      c.strokeStyle='rgba(120,200,255,.7)';c.lineWidth=2;for(var k=0;k<14;k++){var rx=cx-r+((k*.143+0.05)*2*r),ry=cy-r*.1+((t*60*MO+k*37)%(r*.8));c.beginPath();c.moveTo(rx,ry);c.lineTo(rx,ry+8);c.stroke();}
      c.fillStyle='rgba(230,150,60,.18)';c.fillRect(cx-r,cy-r,2*r,2*r);}
    else if(id==='enceladus'){g=c.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#b8d6e6');c.fillStyle=g;c.fillRect(cx-r,cy-r,2*r,2*r);

    else{tm+=dt;pos=[Sp[0]-R*3.3+Math.sin(tm*1.2)*14,Sp[1]+R*1.6+Math.cos(tm*1.8)*6];yr=cur.yr[1];
      c.fillStyle='#d9892f';c.beginPath();c.arc(Sp[0]-R*3.3,Sp[1]+R*3.4,R*1.5,0,TAU);c.fill();label(c,'Titan',Sp[0]-R*3.3,Sp[1]+R*5.2,'#f6c37a',14,'center');}

}

      if(ci>S.vc){panel.append(h('div',{class:'card pp locked'},'Pause point '+k+': '+ck.from+' to '+ck.to+'. Locked until you finish the one before.'));return;}
      var card=h('div',{class:'card pp'}),msg=h('p',{class:'eyebrow'});
      var nb=h('button',{class:'btn',onclick:function(){S.vc++;paintChunks();window.scrollTo({top:0,behavior:'smooth'});}},'Next pause point');
      function upd(){var d=ck.qs.every(isDone);nb.disabled=!d;msg.textContent=d?(k<total?'Nice! Move on when you are ready.':''):'Answer every question to unlock the next step.';}
      card.append(h('h3',{class:'sec',style:'margin-top:0'},'Pause point '+k+' of '+total),
        h('ol',null,h('li',null,'Press play on the video.'),h('li',null,'Watch from '+ck.from+' to '+ck.to+'.'),h('li',null,'Pause the video.'),h('li',null,'Answer the questions below.')),
        h('p',{class:'bank'},h('b',null,'Word bank: '),ck.bank.join('  ·  ')));
      ck.qs.forEach(function(q){card.append(renderQ(q,st.q.indexOf(q),function(){upd();refreshNav();}));});
      card.append(msg);if(k<total)card.append(nb);
      upd();panel.append(card);
    });
  }
  var back=h('button',{class:'btn ghost',onclick:function(){go(0);}},'Back to start');
  main.append(h('div',{class:'grid'},
    h('div',{class:'card labcard'},player,h('p',{class:'eyebrow',style:'margin:10px 0 0'},'Video not showing? ',h('a',{href:'https://www.youtube.com/watch?v=6Zc0SOnM5Us',target:'_blank',rel:'noopener',style:'color:var(--ice)'},'Open it in a new tab.'))),
    h('div',null,h('p',{class:'eyebrow'},'Stop 1 of '+N),h('h2',{class:'stage-title'},'Watch and Note'),h('p',{class:'lead'},st.intro),panel,
      h('div',{class:'nav'},back,hint,nextBtn))));
  paintChunks();refreshNav();
}
function renderStage(n){
  var st=STAGES[n];main.innerHTML='';
  var canvas=mountCanvas();
  var modesEl=h('div',{id:'modes',role:'group','aria-label':'Choose an activity'});
  var ctr=h('div',{id:'controls'});api.controls=ctr;
  infoT=h('h3');infoB=h('p');discUL=h('ul',{class:'disc'});
  lab=st.lab(api);
  var cur=lab.modes[0][0];
  var mbtns=[];
  if(!lab.hideModes){
    lab.modes.forEach(function(m){var b=h('button',{class:'tab','aria-pressed':String(m[0]===cur),onclick:function(){cur=m[0];mbtns.forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});lab.setMode(m[0]);}},m[1]);mbtns.push(b);modesEl.append(b);});
  }
  var qBox=h('div'),nextBtn=h('button',{class:'btn'}),hint=h('span',{class:'hint'});
  function refresh(){
    var left=st.q.filter(function(q){var a=S.ans[q.id];return !(a&&a.done);}).length;
    nextBtn.disabled=left>0;nextBtn.textContent=n<N?'Next stop: '+STAGES[n+1].short:'Build my report';
    hint.textContent=left>0?(left+' question'+(left>1?'s':'')+' left to answer'):'All done here. Great work!';
    paintSteps();
  }
  st.q.forEach(function(q,i){qBox.append(renderQ(q,i,refresh));});
  nextBtn.addEventListener('click',function(){go(n+1);});
  var back=h('button',{class:'btn ghost',onclick:function(){go(n-1<1?0:n-1);}},n>1?'Back':'Back to start');
  if(n===1)back.onclick=function(){go(0);};
  main.append(h('div',{class:'grid'},
    h('div',{class:'card labcard'},modesEl,canvas,ctr),
    h('div',null,h('p',{class:'eyebrow'},'Stop '+n+' of '+N),h('h2',{class:'stage-title'},st.title.replace(/^Stop \d: /,'')),h('p',{class:'lead'},st.intro),
      h('div',{class:'info',role:'status'},infoT,infoB),
      h('h3',{class:'sec'},'Discoveries'),discUL,
      h('h3',{class:'sec'},'Check yourself'),qBox,
      h('div',{class:'nav'},back,hint,nextBtn))));
  fit();lab.setMode(cur);paintDisc();refresh();
}

/* ---------- Report ---------- */
function summary(){
  var out=[],total=0,first=0,done=0;
  for(var n=1;n<=N;n++){
    var st=STAGES[n],rows=[];
    st.q.forEach(function(q,i){
      var a=S.ans[q.id]||{};var ans='',tag='';
      if(q.type==='mc'){ans=q.opts[q.a];total++;if(a.done)done++;if(a.first)first++;tag=a.first?'Correct on 1st try':'Correct after '+a.tries+' tries';}
      else if(q.type==='blank'){ans=q.q.replace('_____',q.ans);total++;if(a.done)done++;if(a.first)first++;tag=a.first?'Correct on 1st try':'Correct after '+a.tries+' tries';}
      else if(q.type==='match'){ans=q.items.map(function(it){var o=q.opts.filter(function(x){return x[0]===it[1];})[0];return it[0]+' = '+o[1];}).join('; ');total++;if(a.done)done++;if(a.first)first++;tag=a.first?'Correct on 1st try':'Correct after '+a.tries+' tries';}
      else if(q.type==='pick'){ans=a.pick!=null?q.opts[a.pick]:'(no answer)';tag='My choice';}
      else{ans=a.text||'(no answer)';tag='My response';}
      rows.push({q:q.type==='blank'?'Video note ('+q.time+')':q.q,a:ans,t:tag});
    });
    out.push({title:'Stop '+n+': '+st.title.replace(/^Stop \d: /,''),rows:rows});
  }
  return {stages:out,total:total,first:first,done:done};
}
function renderReport(){
  main.innerHTML='';infoT=infoB=discUL=null;lab=null;cv=null;
  var s=summary(),today=new Date().toLocaleDateString();
  var wrap=h('div',{class:'card report'},
    h('h2',null,'Mission Report: Saturn'),
    h('p',null,'Pilot: '+S.name+'   |   Date: '+today),
    h('div',{class:'score'},h('div',null,h('b',null,s.first+' / '+s.total),'Right on the first try'),h('div',null,h('b',null,s.done+' / '+s.total),'Questions finished')));
  s.stages.forEach(function(st){
    wrap.append(h('h3',{class:'sec'},st.title));
    var ul=h('ul',{class:'rq'});
    st.rows.forEach(function(r,i){ul.append(h('li',null,h('div',null,(i+1)+'. '+r.q),h('div',{class:'a'},r.a),h('div',{class:'t'},r.t)));});
    wrap.append(ul);
  });
  wrap.append(h('div',{class:'nav noprint'},
    h('button',{class:'btn ghost',onclick:function(){go(N);}},'Back'),
    h('span',{class:'hint'},'Save the PDF. Then turn it in on Canvas.'),
    h('span',null,h('button',{class:'btn',onclick:savePDF},'Download PDF'),' ',h('button',{class:'btn ghost',onclick:function(){window.print();}},'Print'))));
  main.append(wrap);
}
function clean(s){return String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2192/g,'->').replace(/[^\x00-\xFF]/g,'');}
async function savePDF(){
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast('Using Print instead');window.print();return;}
  var doc=new J({unit:'pt',format:'letter'}),M=54,Wd=612-2*M,y=M;
  function add(txt,size,bold,gap){
    doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);
    doc.splitTextToSize(clean(txt),Wd).forEach(function(l){if(y>792-M){doc.addPage();y=M;}doc.text(l,M,y);y+=size*1.3;});y+=gap||0;
  }
  var s=summary();
  add('Mission Report: Saturn',20,true,4);
  add('Pilot: '+S.name+'    Date: '+new Date().toLocaleDateString(),11,false,2);
  add('Right on the first try: '+s.first+' of '+s.total+'    Questions finished: '+s.done+' of '+s.total,11,true,10);
  s.stages.forEach(function(st){
    add(st.title,14,true,4);
    st.rows.forEach(function(r,i){add((i+1)+'. '+r.q,10.5,true,1);add('Answer: '+r.a,10.5,false,0);add('('+r.t+')',9,false,6);});
    y+=6;
  });
  var fname='Saturn_Mission_'+(clean(S.name).replace(/[^\w]+/g,'_')||'Student')+'.pdf';
  var dl=null;
  try{if(typeof claude!=='undefined'&&claude&&claude.use)dl=await claude.use('downloads');}catch(e){dl=null;}
  if(dl){try{await dl.save({filename:fname,data:doc.output('arraybuffer')});toast('PDF ready');}catch(e){if(e&&e.code==='declined')return;doc.save(fname);}}
  else doc.save(fname);
}

go(0);
})();
